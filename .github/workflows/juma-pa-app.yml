# Builds the JUMA PA window for all three systems. PyInstaller cannot
# cross-compile, so each one is built on its own runner.
name: JUMA PA app

on:
  workflow_dispatch:
  push:
    tags: ["juma-pa-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macos }
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk for Linux
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pip pyinstaller pyserial pillow
      - run: python make_icon.py
        working-directory: hl2io/tools
      - run: python make_app.py
        working-directory: hl2io/tools
      - uses: actions/upload-artifact@v4
        with:
          name: juma-pa-${{ matrix.name }}
          path: hl2io/tools/dist/
