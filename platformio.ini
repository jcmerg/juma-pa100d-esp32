; JUMA PA-100D Controller auf ESP32
; Serielle Steuerung, Web-Dashboard und TCI-Bandumschaltung.

[platformio]
; Passwoerter gehoeren nicht ins Repo. platformio_local.ini ist in der
; .gitignore und ueberschreibt [secrets]; fehlt sie, greifen die Platzhalter
; aus include/config.h - dann UNBEDINGT eigene setzen.
extra_configs = platformio_local.ini

[secrets]
; Leer lassen. platformio_local.ini ueberschreibt diesen Abschnitt mit den
; echten Passwoertern; fehlt sie, greifen die Platzhalter aus include/config.h.
flags =

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 460800

; Packt das Dashboard vor jedem Build - Quelle bleibt src/index_html.h
extra_scripts = pre:tools/gzip_html.py

lib_deps =
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
;   Default sind 5 Plaetze - jeder Tab und jeder Reload belegt einen
    -DWEBSOCKETS_SERVER_CLIENT_MAX=8
;   Default sind 5000 ms: ein Client, der nicht mitliest, blockiert den
;   Schreibvorgang - und damit die Hauptschleife - fuenf Sekunden lang.
;   Im LAN braucht ein gesunder Client Bruchteile davon.
    -DWEBSOCKETS_TCP_TIMEOUT=250
    ${secrets.flags}

; Flashen ueber WLAN: pio run -e ota -t upload
[env:ota]
extends         = env:esp32dev
upload_protocol = espota
; mDNS (juma-pa.local) funktioniert nur im selben Netzsegment -
; ueber VLAN-Grenzen die IP nehmen.
upload_port     = juma-pa.local
; Passwort aus der Umgebung, damit es nicht im Repo landet:
;   export JUMA_OTA_PASS=...
upload_flags    = --auth=${sysenv.JUMA_OTA_PASS}
