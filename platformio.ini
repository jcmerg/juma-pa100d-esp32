; JUMA PA controller on an ESP32
; Serial control, web dashboard and TCI band switching.

[platformio]
; Without this, 'pio run' and 'pio run -t upload' work through *every* env:
; the USB upload runs first, then env:ota tries espota on top of it and fails.
; OTA stays available, but only when asked for: pio run -e ota -t upload
default_envs = esp32dev

; Passwords do not belong in the repo. platformio_local.ini is in .gitignore
; and overrides [secrets]; without it the placeholders from include/config.h
; apply - in that case DO set your own.
extra_configs = platformio_local.ini

[secrets]
; Leave empty. platformio_local.ini overrides this section with the real
; passwords; without it the placeholders from include/config.h apply.
flags =

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 460800

; Compresses the dashboard before every build - the source stays src/index_html.h
extra_scripts = pre:tools/gzip_html.py

lib_deps =
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
;   The default is 5 slots - every tab and every reload occupies one
    -DWEBSOCKETS_SERVER_CLIENT_MAX=8
;   The default is 5000 ms: a client that does not keep up blocks the write -
;   and with it the main loop - for five seconds.
;   On a LAN a healthy client needs a fraction of that.
    -DWEBSOCKETS_TCP_TIMEOUT=250
    ${secrets.flags}

; Flashing over Wi-Fi: pio run -e ota -t upload
[env:ota]
extends         = env:esp32dev
upload_protocol = espota
; mDNS (juma-pa.local) only works within the same network segment -
; across VLAN boundaries use the IP address.
upload_port     = juma-pa.local
; Password from the environment so it does not end up in the repo:
;   export JUMA_OTA_PASS=...
upload_flags    = --auth=${sysenv.JUMA_OTA_PASS}
